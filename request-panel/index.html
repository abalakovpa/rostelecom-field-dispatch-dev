<!doctype html><html lang="ru"><meta charset="utf-8"><title>Проверка заявки</title>
<style>body{font:17px system-ui;max-width:850px;margin:40px auto;background:#f4f6fa}label{display:block;margin:20px 0}select,input,button{font:inherit;padding:10px;max-width:100%}select{width:100%}pre{white-space:pre-wrap;background:white;padding:20px}button{cursor:pointer}</style>
<h1>Создать тестовую заявку</h1><p>Панель тестовых заявок. Заявка проходит через рабочий Fastify API и сохраняется в PostgreSQL.</p>
<button id="seed" type="button">Загрузить демонстрационные справочники в пустую БД</button><form><label>Адрес<select id="address" required></select></label><label>Тип работ<select id="work" required></select></label><label>Дата <input id="date" type="date" value="2026-11-16" required></label><label>Начало желаемого двухчасового слота <input id="time" type="time" value="09:00" required></label><button>Создать и назначить</button></form>
<p><a href="/map" target="_blank">Открыть карту и расписание</a></p><pre id="result">Загрузка адресов…</pre>
<script>
document.getElementById('seed').onclick=async()=>{if(!confirm('Загрузить справочники? Разрешено только для пустой БД.'))return;const r=await fetch('/seed',{method:'POST',headers:{'X-Requested-With':'request-panel'}});document.getElementById('result').textContent=JSON.stringify(await r.json(),null,2)};
const $=id=>document.getElementById(id);fetch('/catalog').then(r=>r.json()).then(d=>{for(const b of d.buildings){const o=new Option(`${b.address} · ${b.technology}`,b.building_id);$('address').add(o)}for(const w of d.works)$('work').add(new Option(w.name,w.code));$('result').textContent='Выберите адрес, дату и время.'});
document.querySelector('form').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;$('result').textContent='Подбирается маршрут…';const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),60000);try{const r=await fetch('/create',{signal:controller.signal,method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'request-panel'},body:JSON.stringify({building_id:$('address').value,work_type_code:$('work').value,date:$('date').value,time:$('time').value})});const d=await r.json();$('result').textContent=d.assignment?`Заявка ${d.order_id}\nНазначено: ${d.assignment.date}\nМастер: ${d.assignment.staff_id}\nНачало: ${d.assignment.start}\nОкончание: ${d.assignment.end}`:JSON.stringify(d,null,2)}catch(error){$('result').textContent=error.name==='AbortError'?'Ответ задерживается. Проверьте карту перед повторной отправкой: заявка могла сохраниться.':error.message}finally{clearTimeout(timer);button.disabled=false}};
</script></html>
