name: rostelecom-field-dispatch
services:
  request-panel:
    profiles: [panel]
    build:
      context: .
      dockerfile: request-panel/Dockerfile
    restart: unless-stopped
    environment:
      API_URL: http://api:8080
    ports:
      - "${PANEL_BIND:-0.0.0.0}:${PANEL_PORT:-8082}:8082"
    depends_on:
      api:
        condition: service_healthy
  planner:
    build:
      context: .
      dockerfile: planner-service/Dockerfile
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dispatch
      POSTGRES_DB: dispatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-evaluation-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U dispatch -d dispatch"]
      interval: 5s
      timeout: 5s
      retries: 12
  migrate:
    build: ./api
    command: [node, scripts/migrate.mjs]
    environment: &database
      PGHOST: db
      PGUSER: dispatch
      PGDATABASE: dispatch
      PGPASSWORD: ${POSTGRES_PASSWORD:-local-evaluation-only}
    volumes:
      - ./db/migrations:/app/migrations:ro
    depends_on:
      db:
        condition: service_healthy
  api:
    volumes:
      - ./web:/web:ro
    build: ./api
    restart: unless-stopped
    environment:
      <<: *database
      NODE_ENV: production
      PORT: 8080
      WEB_ROOT: /web
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PLANNER_URL: ${PLANNER_URL:-http://planner:8090/plan}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      planner:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  pgdata:




